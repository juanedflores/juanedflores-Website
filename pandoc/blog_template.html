<!doctype html>
<html $if(lang)$lang="$lang$" $endif$dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="generator" content="pandoc" />
    <title>$title$ · JUANEDFLORES</title>
    <link rel="shortcut icon" href="../../resources/favicon.ico" type="image/x-icon" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- UIkit: some posts use its accordions and tooltips in their markdown -->
    <link rel="stylesheet" href="../../css/uikit.min.css" />
    <script src="../../js/uikit.min.js"></script>
    <script src="../../js/uikit-icons.min.js"></script>

    <!-- icons for the code blocks' copy button -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />

    <!-- code highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/10.7.2/highlight.min.js"></script>

    <!-- site styles (after UIkit so they win) -->
    <link rel="stylesheet" href="../../css/theme.css" />
    <link rel="stylesheet" href="../../css/post.css" />
    <script src="../../js/theme.js"></script>
    <script src="../../js/post.js" defer></script>

    $for(header-includes)$ $header-includes$ $endfor$
  </head>

  <body>
    <!-- TOP BAR -->
    <header class="post-bar">
      <a class="bar-home" href="../../blog.html"><span class="bar-name">JUANEDFLORES</span> <span class="bar-back">← all notes</span></a>
      <span class="bar-fill"></span>
      <button class="toc-toggle" type="button" aria-expanded="false" aria-controls="toc">contents</button>
      <button class="theme-toggle" type="button"></button>
    </header>

    <div class="post-layout">
      <!-- TABLE OF CONTENTS: a sidebar on wide screens, a drop-down on small ones -->
      <nav id="toc" class="toc" aria-label="Contents">
        <p class="toc-title">Contents</p>
        $toc$
      </nav>

      <article class="post">
        <!-- HEADING -->
        <header class="post-head">
          <img src="./cover/cover.png" id="cover-img" class="post-cover" alt="" onerror="this.hidden = true" />
          <p class="post-meta" id="post-meta">$if(date_created)$created $date_created$$endif$</p>
          <h1 class="post-title">$title$</h1>
          <p class="post-tags" id="post-tags"></p>
        </header>

        <!-- BODY -->
        <div id="ArticleBody" class="post-body">$body$</div>

        <!-- previous / next, filled in from Blog/posts.json -->
        <nav class="post-nav" id="post-nav" aria-label="More notes">
          <a class="post-nav-all" href="../../blog.html">← all notes</a>
        </nav>
      </article>
    </div>

    <!-- copy buttons on code blocks -->
    <script src="../../js/highlightjs-badge.js"></script>
  </body>
</html>
