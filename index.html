<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Juan Eduardo Flores</title>
    <meta name="description" content="Juan Eduardo Flores is an artist working with sound, motion, and code." />
    <!-- how a link to this page looks when it's shared -->
    <link rel="canonical" href="https://juanedflores.com/" />
    <meta property="og:site_name" content="Juan Eduardo Flores" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Juan Eduardo Flores" />
    <meta property="og:description" content="Juan Eduardo Flores is an artist working with sound, motion, and code." />
    <meta property="og:url" content="https://juanedflores.com/" />
    <meta property="og:image" content="https://juanedflores.com/images/share/home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Still from Juan Eduardo Flores's demo reel: light through the open zipper of a black backpack" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/site.css" />
    <link rel="shortcut icon" href="resources/favicon.ico" type="image/x-icon" />
    <script src="js/intro.js" defer></script>
    <script src="js/works.js" defer></script>
    <script src="js/passage.js" defer></script>
  </head>

  <body>
    <!-- the reel, then the page: header, works and footer exactly a window
         tall. The header holds to the bottom of the reel until it arrives. -->
    <div class="home">
      <!-- the demo reel, full screen -->
      <section class="intro" aria-label="Demo reel">
        <video class="reel" autoplay muted loop playsinline poster="videos/Voltaje_720p-poster-00001.jpg" aria-label="Demo reel">
          <!-- MP4 first: every browser plays it, and iPhones pick the first
               source they can, autoplaying H.264 where they may stall on WebM.
               On a phone-sized screen, a lighter 540p copy (1.3MB, not 4.6MB). -->
          <source src="videos/Voltaje_540p.mp4" type="video/mp4" media="(max-width: 760px)" />
          <source src="videos/Voltaje_720p-transcode.mp4" type="video/mp4" />
          <source src="videos/Voltaje_720p-transcode.webm" type="video/webm" />
        </video>
      </section>

      <header class="site-header">
        <!-- data-ride: starts on the reel, rides up into the header (js/intro.js) -->
        <a class="site-name" href="index.html" data-ride>Juan Eduardo Flores</a>
        <nav class="site-nav" aria-label="Site">
          <a href="#works" aria-current="page" data-ride>Works</a>
          <a href="about.html" data-ride>About</a>
        </nav>
      </header>

      <main class="page" id="works">
        <h1 class="visually-hidden">Works</h1>
        <!-- Index opens a list of every work over the left of the grid, with
             a preview of the one under the pointer on the right; the pages
             show the works four at a time once there are more than fit one
             screen (js/works.js) -->
        <div class="section-title works-bar">
          <button class="index-toggle" type="button" aria-expanded="false" aria-controls="index-panel" hidden>Index</button>
          <nav class="pages" aria-label="Pages of works">
            <span class="page-at" aria-live="polite">1 / 1</span>
            <button class="page-turn" type="button" data-turn="-1" aria-label="Previous page" disabled><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M17 6H1.5M6.5 1 1.5 6l5 5" /></svg></button>
            <button class="page-turn" type="button" data-turn="1" aria-label="Next page" disabled><svg viewBox="0 0 18 12" aria-hidden="true"><path d="M1 6h15.5M11.5 1l5 5-5 5" /></svg></button>
          </nav>
        </div>

        <div class="shelf">
          <ul class="works">
            <li data-blurb="A collection of videos sent by the artist's mother of the inside of her purse are synced to fireball events from the American Meteor Society YouTube channel.">
              <a class="work" href="works/everyday-once-in-a-lifetime.html">
                <img src="images/thesis-2023/3189-sm.jpg" alt="Two videos side by side on a wall-mounted TV" />
                <span class="work-title">Everyday. Once in a Lifetime.</span>
                <span class="work-meta">2023 · Video</span>
              </a>
            </li>
            <li data-blurb="The video is of a live feed from the El Paso, Texas – Ciudad Juárez, Mexico International Border Bridge.">
              <a class="work" href="works/backpack.html">
                <img src="images/thesis-2023/3243-sm.jpg" alt="A screen glowing through the open zipper of a black backpack" />
                <span class="work-title">Backpack (from the zipper series)</span>
                <span class="work-meta">2021 · Backpack, monitor, and zipper</span>
              </a>
            </li>
            <li>
              <a class="work" href="works/untitled-2023.html">
                <img src="images/thesis-2023/3262-sm.jpg" alt="Light through the opening of a zipper across a black curtain" />
                <span class="work-title">Untitled</span>
                <span class="work-meta">2023</span>
              </a>
            </li>
            <li data-blurb="Instructions for a walk are performed and transformed during the process.">
              <a class="work" href="works/walking-poems.html">
                <img src="images/thesis-2023/3241-sm.jpg" alt="A vertical screen, a framed photograph and two mounted sheets of paper" />
                <span class="work-title">Walking Poems: SAIC Gallery</span>
                <span class="work-meta">2023 · Video, color print, water soluble paper</span>
              </a>
            </li>
          </ul>
        </div>
      </main>

      <footer class="site-footer">
        <span>Last updated <time class="updated" datetime="2026-10-15">October 15, 2026</time></span>
        <script>
          // when the site was last published, as the server tells it; a browser
          // that isn't told gives the time now, so then the date above stays
          (function () {
            var at = new Date(document.lastModified);
            if (isNaN(at) || Date.now() - at < 60000) return;
            var el = document.querySelector('.updated');
            el.dateTime = at.toISOString().slice(0, 10);
            el.textContent = at.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
          })();
        </script>
      </footer>
    </div>
  </body>
</html>
